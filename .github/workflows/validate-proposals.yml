name: Validate correction proposals
on:
  issues:
    types: [opened, edited, labeled, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: proposal-validation-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'htr-oprava') || contains(github.event.issue.labels.*.name, 'segmentace-oprava')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {default: validateIssue} = await import(process.cwd() + '/web/scripts/validate-issue.mjs');
            await validateIssue({github,context,core});
