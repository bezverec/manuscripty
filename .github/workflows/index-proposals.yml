name: Update open correction proposals
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, deleted]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: open-proposal-index
  cancel-in-progress: false
jobs:
  index:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'htr-oprava') || contains(github.event.issue.labels.*.name, 'segmentace-oprava') || github.event.label.name == 'htr-oprava' || github.event.label.name == 'segmentace-oprava'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {default: updateProposals} = await import(process.cwd() + '/web/scripts/update-proposals.mjs');
            await updateProposals({github,context,core});
